<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <rect width="600" height="800" fill="#F5F1EB"/>

  <!-- Top ceiling shadow -->
  <rect x="0" y="0" width="600" height="40" fill="#1C0F0C"/>

  <!-- Large clay block (left elevation) -->
  <rect x="40" y="120" width="240" height="540" fill="#C9A699"/>

  <!-- Tall door opening on clay -->
  <rect x="100" y="220" width="80" height="320" fill="#1C0F0C"/>

  <!-- Small high window on clay -->
  <rect x="200" y="180" width="60" height="40" fill="#F5F1EB"/>

  <!-- Right block: deep earth -->
  <rect x="320" y="200" width="220" height="460" fill="#1C0F0C"/>

  <!-- Grid of small openings -->
  <g fill="#E8DDD4">
    <rect x="350" y="240" width="40" height="60"/>
    <rect x="410" y="240" width="40" height="60"/>
    <rect x="470" y="240" width="40" height="60"/>
    <rect x="350" y="330" width="40" height="60"/>
    <rect x="410" y="330" width="40" height="60"/>
    <rect x="470" y="330" width="40" height="60"/>
    <rect x="350" y="420" width="40" height="60"/>
    <rect x="410" y="420" width="40" height="60"/>
    <rect x="470" y="420" width="40" height="60"/>
  </g>

  <!-- Terracotta plinth between blocks -->
  <rect x="280" y="120" width="40" height="540" fill="#A0614A"/>

  <!-- Floor -->
  <rect x="0" y="660" width="600" height="140" fill="#E8DDD4"/>
  <line x1="0" y1="660" x2="600" y2="660" stroke="#1C0F0C" stroke-width="0.5"/>

  <!-- Ground line marks -->
  <g stroke="#5C2020" stroke-width="0.5" opacity="0.5">
    <line x1="60" y1="720" x2="100" y2="720"/>
    <line x1="160" y1="720" x2="200" y2="720"/>
    <line x1="260" y1="720" x2="300" y2="720"/>
    <line x1="360" y1="720" x2="400" y2="720"/>
    <line x1="460" y1="720" x2="500" y2="720"/>
  </g>

  <!-- Scale bar -->
  <g transform="translate(40, 750)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#1C0F0C" stroke-width="0.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#1C0F0C" stroke-width="0.5"/>
    <line x1="60" y1="-3" x2="60" y2="3" stroke="#1C0F0C" stroke-width="0.5"/>
    <line x1="120" y1="-4" x2="120" y2="4" stroke="#1C0F0C" stroke-width="0.5"/>
    <text x="0" y="20" font-family="DM Sans, sans-serif" font-size="8" letter-spacing="1.5" fill="#1C0F0C">0 — 5m</text>
  </g>

  <!-- Title plate -->
  <text x="560" y="60" text-anchor="end" font-family="DM Sans, sans-serif" font-size="9" letter-spacing="2" fill="#F5F1EB">ELEVATION · A</text>
</svg>
