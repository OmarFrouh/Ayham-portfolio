<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
  <rect width="900" height="600" fill="#E8DDD4"/>

  <!-- Atmospheric horizontal bands -->
  <rect x="0" y="0"   width="900" height="120" fill="#C9A699"/>
  <rect x="0" y="120" width="900" height="60"  fill="#A0614A"/>
  <rect x="0" y="180" width="900" height="180" fill="#1C0F0C"/>
  <rect x="0" y="360" width="900" height="80"  fill="#5C2020"/>
  <rect x="0" y="440" width="900" height="160" fill="#C9A699"/>

  <!-- Floating thin lines suggesting drift -->
  <g stroke="#F5F1EB" stroke-width="0.5">
    <line x1="60"  y1="220" x2="280" y2="220"/>
    <line x1="320" y1="240" x2="540" y2="240"/>
    <line x1="580" y1="260" x2="800" y2="260"/>
    <line x1="40"  y1="290" x2="220" y2="290"/>
    <line x1="260" y1="310" x2="480" y2="310"/>
    <line x1="520" y1="330" x2="780" y2="330"/>
  </g>

  <!-- Vertical pole element -->
  <rect x="700" y="60" width="3" height="480" fill="#1C0F0C"/>
  <circle cx="701" cy="60" r="6" fill="#A0614A"/>

  <!-- Reference plate -->
  <g transform="translate(40, 540)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#1C0F0C" stroke-width="0.5"/>
    <text x="32" y="4" font-family="DM Sans, sans-serif" font-size="9" letter-spacing="2" fill="#1C0F0C">DRIFT · STUDY 01</text>
  </g>

  <text x="860" y="560" text-anchor="end" font-family="DM Sans, sans-serif" font-size="9" letter-spacing="2" fill="#1C0F0C">AUB · MMXXIV</text>
</svg>
