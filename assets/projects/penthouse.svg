<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid slice">
  <!-- Dark sophisticated penthouse hallway -->
  <rect width="600" height="450" fill="#1C0F0C"/>
  <!-- Floor -->
  <rect x="0" y="350" width="600" height="100" fill="#5C2020" opacity="0.5"/>
  <!-- Vanishing-point perspective walls -->
  <path d="M 0 0 L 0 450 L 100 360 L 100 90 Z" fill="#5C2020" opacity="0.65"/>
  <path d="M 600 0 L 600 450 L 500 360 L 500 90 Z" fill="#5C2020" opacity="0.65"/>
  <!-- Ceiling -->
  <path d="M 0 0 L 600 0 L 500 90 L 100 90 Z" fill="#1C0F0C"/>
  <!-- Far end wall (with door) -->
  <rect x="100" y="90" width="400" height="270" fill="#C9A699"/>
  <rect x="240" y="150" width="120" height="210" fill="#5C2020"/>
  <rect x="244" y="154" width="112" height="202" fill="#A0614A" opacity="0.8"/>
  <!-- Door split line -->
  <line x1="300" y1="154" x2="300" y2="356" stroke="#1C0F0C" stroke-width="1"/>
  <!-- Warm glow from door -->
  <rect x="244" y="154" width="112" height="20" fill="#F5F1EB" opacity="0.6"/>
  <!-- Wall sconces -->
  <g fill="#A0614A">
    <rect x="60"  y="200" width="3"  height="14"/>
    <rect x="540" y="200" width="3"  height="14"/>
  </g>
  <!-- Pin lights on ceiling line -->
  <g fill="#A0614A" opacity="0.85">
    <circle cx="160" cy="100" r="2"/>
    <circle cx="240" cy="100" r="2"/>
    <circle cx="300" cy="100" r="2"/>
    <circle cx="360" cy="100" r="2"/>
    <circle cx="440" cy="100" r="2"/>
  </g>
  <!-- Console table against far wall -->
  <rect x="180" y="320" width="60" height="40" fill="#1C0F0C"/>
  <rect x="360" y="320" width="60" height="40" fill="#1C0F0C"/>
  <!-- Vase silhouettes -->
  <ellipse cx="210" cy="310" rx="6" ry="12" fill="#1C0F0C"/>
  <ellipse cx="390" cy="310" rx="6" ry="12" fill="#1C0F0C"/>
  <!-- Floor highlight stripe -->
  <rect x="240" y="380" width="120" height="2" fill="#A0614A" opacity="0.4"/>
</svg>
