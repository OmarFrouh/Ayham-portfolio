<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid slice">
  <!-- Soft limestone interior with arched alcove -->
  <rect width="600" height="450" fill="#E8DDD4"/>
  <!-- Floor -->
  <rect x="0" y="340" width="600" height="110" fill="#C9A699"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#1C0F0C" stroke-width="0.5" opacity="0.3"/>
  <!-- Back wall shadow band -->
  <rect x="0" y="60" width="600" height="40" fill="#1C0F0C" opacity="0.06"/>
  <!-- Arched alcove -->
  <path d="M 220 340 L 220 200 Q 220 130 300 130 Q 380 130 380 200 L 380 340 Z" fill="#1C0F0C" opacity="0.85"/>
  <path d="M 230 340 L 230 200 Q 230 140 300 140 Q 370 140 370 200 L 370 340 Z" fill="#5C2020" opacity="0.8"/>
  <!-- Plant -->
  <g fill="#1C0F0C">
    <ellipse cx="80"  cy="240" rx="22" ry="50"/>
    <ellipse cx="60"  cy="270" rx="18" ry="40"/>
    <ellipse cx="100" cy="260" rx="16" ry="44"/>
    <rect x="65" y="290" width="30" height="50" fill="#5C2020"/>
  </g>
  <!-- Chair silhouette -->
  <g fill="#1C0F0C">
    <rect x="450" y="280" width="80" height="60"/>
    <rect x="455" y="220" width="70" height="65" fill="#5C2020"/>
    <rect x="450" y="335" width="6" height="20"/>
    <rect x="524" y="335" width="6" height="20"/>
  </g>
  <!-- Floor reflection of arch -->
  <path d="M 220 340 L 220 360 L 380 360 L 380 340 Z" fill="#1C0F0C" opacity="0.15"/>
</svg>
