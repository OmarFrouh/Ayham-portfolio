<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid slice">
  <!-- Warm earth-toned living room with fireplace -->
  <rect width="600" height="450" fill="#C9A699"/>
  <!-- Floor -->
  <rect x="0" y="330" width="600" height="120" fill="#1C0F0C" opacity="0.85"/>
  <!-- Back wall with darker plinth -->
  <rect x="0" y="280" width="600" height="50" fill="#5C2020" opacity="0.6"/>
  <!-- Fireplace rectangle -->
  <rect x="240" y="160" width="120" height="170" fill="#1C0F0C"/>
  <rect x="252" y="220" width="96" height="80" fill="#A0614A"/>
  <rect x="258" y="226" width="84" height="68" fill="#5C2020"/>
  <!-- Flame -->
  <ellipse cx="300" cy="270" rx="14" ry="20" fill="#A0614A" opacity="0.9"/>
  <ellipse cx="300" cy="275" rx="8"  ry="14" fill="#F5F1EB" opacity="0.7"/>
  <!-- Couch -->
  <g fill="#1C0F0C">
    <rect x="60"  y="270" width="160" height="60"/>
    <rect x="65"  y="240" width="150" height="35" fill="#5C2020"/>
    <rect x="60"  y="325" width="6"   height="14"/>
    <rect x="214" y="325" width="6"   height="14"/>
  </g>
  <g fill="#1C0F0C">
    <rect x="380" y="270" width="160" height="60"/>
    <rect x="385" y="240" width="150" height="35" fill="#5C2020"/>
    <rect x="380" y="325" width="6"   height="14"/>
    <rect x="534" y="325" width="6"   height="14"/>
  </g>
  <!-- Coffee table -->
  <rect x="240" y="335" width="120" height="6" fill="#1C0F0C"/>
  <!-- Ceiling beam suggestion -->
  <rect x="0" y="40" width="600" height="3" fill="#1C0F0C" opacity="0.4"/>
</svg>
