<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid slice">
  <!-- Dining room with stone wall and tall window -->
  <rect width="600" height="450" fill="#C9A699"/>
  <!-- Stone wall left -->
  <rect x="0" y="0" width="260" height="450" fill="#1C0F0C"/>
  <g fill="#5C2020" opacity="0.55">
    <rect x="20"  y="40"  width="32" height="14"/>
    <rect x="60"  y="60"  width="28" height="13"/>
    <rect x="100" y="50"  width="34" height="15"/>
    <rect x="150" y="70"  width="30" height="14"/>
    <rect x="200" y="55"  width="34" height="13"/>
    <rect x="30"  y="100" width="30" height="14"/>
    <rect x="80"  y="110" width="32" height="13"/>
    <rect x="130" y="100" width="30" height="14"/>
    <rect x="180" y="115" width="34" height="13"/>
    <rect x="20"  y="160" width="30" height="14"/>
    <rect x="70"  y="170" width="34" height="13"/>
    <rect x="120" y="160" width="32" height="14"/>
    <rect x="170" y="175" width="30" height="13"/>
    <rect x="210" y="160" width="34" height="14"/>
    <rect x="40"  y="220" width="32" height="14"/>
    <rect x="90"  y="230" width="30" height="13"/>
    <rect x="140" y="220" width="32" height="14"/>
    <rect x="190" y="235" width="30" height="13"/>
    <rect x="30"  y="280" width="30" height="14"/>
    <rect x="80"  y="290" width="32" height="13"/>
    <rect x="130" y="280" width="30" height="14"/>
    <rect x="180" y="295" width="32" height="13"/>
    <rect x="50"  y="340" width="30" height="14"/>
    <rect x="100" y="350" width="32" height="13"/>
    <rect x="150" y="340" width="30" height="14"/>
    <rect x="200" y="355" width="32" height="13"/>
  </g>
  <!-- Tall window -->
  <rect x="280" y="50" width="180" height="280" fill="#A0614A" opacity="0.9"/>
  <rect x="282" y="52" width="176" height="276" fill="#5C2020" opacity="0.7"/>
  <line x1="370" y1="50" x2="370" y2="330" stroke="#1C0F0C" stroke-width="2"/>
  <line x1="280" y1="190" x2="460" y2="190" stroke="#1C0F0C" stroke-width="2"/>
  <!-- Distant landscape suggestion -->
  <path d="M 282 240 L 320 230 L 360 240 L 400 232 L 440 240 L 458 235 L 458 280 L 282 280 Z" fill="#1C0F0C" opacity="0.5"/>
  <!-- Dining table -->
  <rect x="240" y="350" width="320" height="14" fill="#1C0F0C"/>
  <rect x="248" y="364" width="6" height="60" fill="#1C0F0C"/>
  <rect x="546" y="364" width="6" height="60" fill="#1C0F0C"/>
  <!-- Chairs -->
  <g fill="#1C0F0C">
    <rect x="275" y="295" width="38" height="58"/>
    <rect x="330" y="295" width="38" height="58"/>
    <rect x="385" y="295" width="38" height="58"/>
    <rect x="440" y="295" width="38" height="58"/>
    <rect x="495" y="295" width="38" height="58"/>
  </g>
  <!-- Floor -->
  <rect x="260" y="370" width="340" height="80" fill="#1C0F0C" opacity="0.92"/>
  <!-- Pendant -->
  <line x1="400" y1="0" x2="400" y2="60" stroke="#1C0F0C" stroke-width="0.5"/>
  <rect x="392" y="58" width="16" height="20" fill="#1C0F0C"/>
  <rect x="388" y="78" width="24" height="2" fill="#A0614A" opacity="0.8"/>
