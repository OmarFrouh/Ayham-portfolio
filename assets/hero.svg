<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice">
  <rect width="600" height="900" fill="#E8DDD4"/>

  <!-- Top plaster band -->
  <rect x="0" y="0" width="600" height="60" fill="#C9A699"/>

  <!-- Main dark wall mass -->
  <rect x="60" y="60" width="420" height="680" fill="#1C0F0C"/>

  <!-- Vertical light slots (tall windows) -->
  <rect x="110" y="170" width="36" height="400" fill="#F5F1EB"/>
  <rect x="170" y="170" width="36" height="400" fill="#F5F1EB"/>
  <rect x="230" y="170" width="36" height="400" fill="#F5F1EB"/>

  <!-- Wide horizontal opening -->
  <rect x="300" y="280" width="160" height="70" fill="#F5F1EB"/>

  <!-- Inner shadow strip on horizontal opening -->
  <rect x="300" y="280" width="160" height="6" fill="#1C0F0C" opacity="0.5"/>

  <!-- Floor plane (clay) -->
  <rect x="0" y="740" width="600" height="160" fill="#C9A699"/>

  <!-- Terracotta accent ribbon (right) -->
  <rect x="500" y="60" width="14" height="680" fill="#A0614A"/>

  <!-- Inset trim line under accent -->
  <line x1="500" y1="60" x2="500" y2="740" stroke="#5C2020" stroke-width="0.5"/>

  <!-- Floor join line -->
  <line x1="0" y1="740" x2="600" y2="740" stroke="#1C0F0C" stroke-width="0.5"/>

  <!-- Faint reference grid -->
  <line x1="60" y1="0" x2="60" y2="900" stroke="#1C0F0C" stroke-width="0.5" opacity="0.15"/>
  <line x1="480" y1="0" x2="480" y2="900" stroke="#1C0F0C" stroke-width="0.5" opacity="0.15"/>

  <!-- Small terracotta marker dot (light source) -->
  <circle cx="380" cy="220" r="3" fill="#A0614A"/>

  <!-- Bottom marker label -->
  <g transform="translate(40, 870)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#1C0F0C" stroke-width="0.5"/>
    <text x="30" y="4" font-family="DM Sans, sans-serif" font-size="9" letter-spacing="2" fill="#1C0F0C">SECTION · I</text>
  </g>

  <!-- Top-right plate -->
  <g transform="translate(540, 30)">
    <text x="0" y="0" text-anchor="end" font-family="DM Sans, sans-serif" font-size="9" letter-spacing="2" fill="#1C0F0C">N° 001</text>
  </g>
</svg>
