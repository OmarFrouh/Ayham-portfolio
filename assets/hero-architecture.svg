<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" overflow="visible" preserveAspectRatio="xMidYMax meet">
  <!-- =============================================
       Hero architecture scene
       Stone-ruins meets modern glass extension, dusk
       Building forms intentionally extend above y=0
       ============================================= -->

  <!-- Sky band inside the image frame (the visible rect) -->
  <rect x="0" y="0" width="900" height="760" fill="#C9A699"/>

  <!-- Lower atmosphere / horizon -->
  <rect x="0" y="380" width="900" height="60" fill="#A0614A" opacity="0.55"/>
  <rect x="0" y="440" width="900" height="50" fill="#5C2020" opacity="0.45"/>

  <!-- Water -->
  <rect x="0" y="490" width="900" height="270" fill="#1C0F0C" opacity="0.92"/>

  <!-- Distant background ridge -->
  <path d="M 0 410 L 120 392 L 240 408 L 380 388 L 540 404 L 700 392 L 820 408 L 900 396 L 900 440 L 0 440 Z" fill="#5C2020" opacity="0.5"/>

  <!-- Right-side trees (extend ABOVE the frame, poking out the top) -->
  <ellipse cx="760" cy="60"  rx="110" ry="180" fill="#1C0F0C"/>
  <ellipse cx="830" cy="-40" rx="80"  ry="160" fill="#1C0F0C"/>
  <ellipse cx="700" cy="160" rx="90"  ry="140" fill="#1C0F0C" opacity="0.95"/>

  <!-- Left bank greenery -->
  <ellipse cx="60"  cy="430" rx="120" ry="60" fill="#1C0F0C" opacity="0.9"/>
  <ellipse cx="40"  cy="380" rx="70"  ry="100" fill="#1C0F0C"/>

  <!-- Stone tower (left of building) — extends above viewBox -->
  <path d="M 200 -40 L 200 480 L 290 480 L 290 -10 Z" fill="#1C0F0C"/>
  <path d="M 200 -40 L 290 -10 L 290 30 L 200 0 Z" fill="#A0614A" opacity="0.3"/>

  <!-- Tall pointed gable of the stone ruin (pokes high above the frame) -->
  <path d="M 240 -80 L 200 100 L 290 100 Z" fill="#1C0F0C"/>

  <!-- Arched window opening on the tower -->
  <path d="M 230 50 Q 230 30 245 30 Q 260 30 260 50 L 260 90 L 230 90 Z" fill="#5C2020"/>
  <path d="M 232 48 Q 232 32 245 32 Q 258 32 258 48 L 258 88 L 232 88 Z" fill="#A0614A" opacity="0.7"/>

  <!-- Main stone wall mass -->
  <path d="M 290 60 L 290 480 L 580 480 L 580 90 L 540 60 Z" fill="#1C0F0C"/>

  <!-- Texture: irregular stones on the wall (subtle, terracotta tint) -->
  <g fill="#5C2020" opacity="0.45">
    <rect x="305" y="110" width="22" height="10"/>
    <rect x="335" y="125" width="18" height="9"/>
    <rect x="365" y="115" width="24" height="11"/>
    <rect x="400" y="130" width="20" height="10"/>
    <rect x="430" y="120" width="22" height="9"/>
    <rect x="460" y="135" width="18" height="11"/>
    <rect x="500" y="125" width="22" height="10"/>
    <rect x="540" y="115" width="20" height="11"/>
    <rect x="310" y="170" width="20" height="10"/>
    <rect x="345" y="180" width="22" height="9"/>
    <rect x="385" y="175" width="18" height="11"/>
    <rect x="420" y="185" width="22" height="10"/>
    <rect x="460" y="175" width="20" height="11"/>
    <rect x="500" y="185" width="22" height="9"/>
    <rect x="540" y="175" width="18" height="11"/>
    <rect x="310" y="240" width="20" height="10"/>
    <rect x="345" y="250" width="22" height="9"/>
    <rect x="385" y="240" width="18" height="11"/>
    <rect x="430" y="250" width="22" height="10"/>
    <rect x="470" y="240" width="20" height="9"/>
    <rect x="510" y="250" width="18" height="11"/>
    <rect x="545" y="240" width="22" height="10"/>
    <rect x="310" y="310" width="24" height="10"/>
    <rect x="350" y="320" width="20" height="11"/>
    <rect x="390" y="310" width="22" height="9"/>
    <rect x="430" y="320" width="18" height="11"/>
    <rect x="465" y="310" width="22" height="10"/>
    <rect x="510" y="320" width="20" height="11"/>
    <rect x="550" y="310" width="22" height="10"/>
    <rect x="310" y="380" width="22" height="11"/>
    <rect x="350" y="390" width="18" height="9"/>
    <rect x="385" y="380" width="20" height="11"/>
    <rect x="420" y="390" width="22" height="10"/>
    <rect x="460" y="380" width="18" height="11"/>
    <rect x="498" y="390" width="22" height="9"/>
    <rect x="540" y="380" width="20" height="11"/>
    <rect x="310" y="440" width="22" height="10"/>
    <rect x="350" y="450" width="20" height="11"/>
    <rect x="390" y="440" width="22" height="9"/>
    <rect x="430" y="450" width="18" height="11"/>
    <rect x="465" y="440" width="22" height="10"/>
    <rect x="510" y="450" width="20" height="11"/>
    <rect x="550" y="440" width="22" height="10"/>
  </g>

  <!-- Modern glass-and-steel extension cantilevered into the ruin -->
  <rect x="320" y="200" width="240" height="170" fill="#1C0F0C"/>
  <rect x="324" y="204" width="232" height="162" fill="#A0614A"/>

  <!-- Glass mullions -->
  <g stroke="#1C0F0C" stroke-width="2" fill="none">
    <line x1="380" y1="204" x2="380" y2="366"/>
    <line x1="440" y1="204" x2="440" y2="366"/>
    <line x1="500" y1="204" x2="500" y2="366"/>
    <line x1="324" y1="282" x2="556" y2="282"/>
  </g>

  <!-- Warm interior light glow (small bright rectangles for "lights inside") -->
  <g fill="#F5F1EB" opacity="0.85">
    <rect x="328" y="220" width="48" height="56"/>
    <rect x="384" y="220" width="52" height="56"/>
    <rect x="444" y="220" width="52" height="56"/>
    <rect x="504" y="220" width="48" height="56"/>
    <rect x="328" y="286" width="48" height="76"/>
    <rect x="384" y="286" width="52" height="76"/>
    <rect x="444" y="286" width="52" height="76"/>
    <rect x="504" y="286" width="48" height="76"/>
  </g>

  <!-- Tiny figures inside (silhouettes for scale) -->
  <g fill="#1C0F0C" opacity="0.6">
    <rect x="345" y="246" width="2" height="14"/>
    <rect x="395" y="252" width="2" height="12"/>
    <rect x="470" y="248" width="2" height="14"/>
    <rect x="525" y="252" width="2" height="12"/>
  </g>

  <!-- Right wall fragment (stub of ruin) -->
  <path d="M 580 200 L 580 480 L 640 480 L 640 220 Z" fill="#1C0F0C"/>

  <!-- Small ground lights along the path -->
  <g fill="#A0614A">
    <circle cx="160" cy="490" r="3"/>
    <circle cx="220" cy="500" r="3"/>
    <circle cx="660" cy="490" r="3"/>
    <circle cx="720" cy="500" r="3"/>
  </g>

  <!-- Reflection of the building in the water (softer, lower opacity) -->
  <g opacity="0.35">
    <rect x="290" y="490" width="290" height="180" fill="#1C0F0C"/>
    <rect x="200" y="490" width="90" height="160" fill="#1C0F0C"/>
    <rect x="580" y="490" width="60" height="140" fill="#1C0F0C"/>
  </g>

  <!-- Warm reflected light streaks on water -->
  <g fill="#A0614A" opacity="0.55">
    <rect x="340" y="520" width="220" height="2"/>
    <rect x="350" y="556" width="200" height="1.5"/>
    <rect x="360" y="592" width="180" height="1.5"/>
    <rect x="370" y="628" width="160" height="1.5"/>
    <rect x="380" y="664" width="140" height="1"/>
  </g>

  <!-- Subtle terracotta horizon glow at the meet of water and ground -->
  <rect x="0" y="488" width="900" height="1.5" fill="#A0614A" opacity="0.7"/>

  <!-- Small stone steps leading down (foreground) -->
  <g fill="#1C0F0C">
    <rect x="120" y="488" width="80" height="6"/>
    <rect x="110" y="494" width="100" height="6"/>
    <rect x="100" y="500" width="120" height="6"/>
  </g>
</svg>
